[package]
name = "fit_web"
description = "Browser UI for print-fit (WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fit_core = { path = "../fit_core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob", "BlobPropertyBag", "Document", "DomTokenList", "Element", "Event", "EventTarget",
  "File", "FileList", "HtmlAnchorElement", "HtmlButtonElement", "HtmlElement",
  "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlOptionElement",
  "Location", "Navigator", "Node", "NodeList", "Storage", "Url", "Window", "History",
]
